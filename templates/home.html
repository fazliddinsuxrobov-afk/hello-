<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — Ibrohim</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --bg: #07080d;
            --text: #f5f5f7;
            --muted: #777989;
            --accent: #9b8cff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(ellipse at 50% 110%, #211747 0%, transparent 55%),
                radial-gradient(ellipse at 10% 10%, #111c35 0%, transparent 45%),
                #07080d;
        }

        .grid {
            position: fixed;
            inset: -50%;
            z-index: -2;
            background-image:
                linear-gradient(#ffffff08 1px, transparent 1px),
                linear-gradient(90deg, #ffffff08 1px, transparent 1px);
            background-size: 65px 65px;
            transform: perspective(600px) rotateX(55deg);
            mask-image: linear-gradient(transparent, black 40%, transparent);
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: perspective(600px) rotateX(55deg) translateY(0);
            }

            to {
                transform: perspective(600px) rotateX(55deg) translateY(65px);
            }
        }

        /* GLOW */

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: .2;
            z-index: -1;
            pointer-events: none;
            animation: float 9s ease-in-out infinite alternate;
        }

        .glow.one {
            background: #6555ff;
            top: -250px;
            left: -150px;
        }

        .glow.two {
            background: #a044ff;
            bottom: -300px;
            right: -150px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 80px) scale(1.3);
            }
        }

        /* PARTICLES */

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* MAIN */

        main {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .content {
            text-align: center;
            position: relative;
            animation: reveal 1.5s cubic-bezier(.2, .8, .2, 1) forwards;
            opacity: 0;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(50px) scale(.96);
                filter: blur(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .overline {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 9px;
            color: var(--accent);
            margin-bottom: 35px;
            animation: fadeIn 2s ease;
        }

        h1 {
            font-size: clamp(42px, 8vw, 100px);
            font-weight: 800;
            letter-spacing: -5px;
            line-height: 1.1;
        }

        h1 span {
            display: block;
            background: linear-gradient(110deg,
                    #ffffff 10%,
                    #a99aff 45%,
                    #d9caff 65%,
                    #ffffff 90%);
            background-size: 200% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .name {
            margin-top: 25px;
            font-size: clamp(25px, 4vw, 42px);
            font-weight: 300;
            letter-spacing: 12px;
            color: #c4c1d8;
            animation: nameReveal 2s ease forwards;
            animation-delay: .5s;
            opacity: 0;
        }

        @keyframes nameReveal {
            from {
                opacity: 0;
                letter-spacing: 25px;
                filter: blur(8px);
            }

            to {
                opacity: 1;
                letter-spacing: 12px;
                filter: blur(0);
            }
        }

        .separator {
            width: 90px;
            height: 2px;
            margin: 40px auto;
            background: linear-gradient(90deg, transparent, #a99aff, transparent);
            box-shadow: 0 0 25px #9b8cff;
            animation: separator 3s ease-in-out infinite alternate;
        }

        @keyframes separator {
            from {
                width: 50px;
                opacity: .5;
            }

            to {
                width: 130px;
                opacity: 1;
            }
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 3px;
            font-weight: 400;
            animation: fadeIn 2.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CORNER DETAILS */

        .corner {
            position: fixed;
            color: #ffffff35;
            font-size: 10px;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .top-left {
            top: 35px;
            left: 40px;
        }

        .top-right {
            top: 35px;
            right: 40px;
        }

        .bottom-left {
            bottom: 35px;
            left: 40px;
        }

        .bottom-right {
            bottom: 35px;
            right: 40px;
        }

        /* RESPONSIVE */

        @media(max-width: 600px) {
            h1 {
                letter-spacing: -2px;
            }

            .name {
                letter-spacing: 6px;
            }

            .corner {
                font-size: 8px;
            }

            .top-left,
            .bottom-left {
                left: 15px;
            }

            .top-right,
            .bottom-right {
                right: 15px;
            }
        }

        @media(prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="grid"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <canvas id="particles"></canvas>

    <div class="corner top-left">WELCOME EXPERIENCE</div>
    <div class="corner top-right">EST. 2026</div>
    <div class="corner bottom-left">A SPECIAL MOMENT</div>
    <div class="corner bottom-right">DESIGNED WITH RESPECT</div>

    <main>
        <div class="content">

            <div class="overline">A WARM GREETING</div>

            <h1>
                Здравствуйте,
                <span>Учитель</span>
            </h1>

            <div class="name">ИБРОХИМ</div>

            <div class="separator"></div>

            <div class="subtitle">
                РАДЫ ПРИВЕТСТВОВАТЬ ВАС
            </div>

        </div>
    </main>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        let particles = [];

        function resize() {
            canvas.width = window.innerWidth * devicePixelRatio;
            canvas.height = window.innerHeight * devicePixelRatio;
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * innerWidth;
                this.y = Math.random() * innerHeight;
                this.size = Math.random() * 2 + .5;
                this.speed = Math.random() * .35 + .1;
                this.opacity = Math.random() * .5 + .1;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.phase += .01;
                this.x += Math.sin(this.phase) * .25;

                if (this.y < -10) {
                    this.y = innerHeight + 10;
                    this.x = Math.random() * innerWidth;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(174, 157, 255, ${this.opacity})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#9b8cff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 90; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Smooth mouse glow
        let mouseX = innerWidth / 2;
        let mouseY = innerHeight / 2;

        document.addEventListener('mousemove', event => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        const glow = document.createElement('div');
        glow.style.cssText = `
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    background:radial-gradient(circle, #8b79ff12, transparent 70%);
    pointer-events:none;
    z-index:0;
    transform:translate(-50%,-50%);
`;

        document.body.appendChild(glow);

        function followMouse() {
            glow.style.left = mouseX + 'px';
            glow.style.top = mouseY + 'px';
            requestAnimationFrame(followMouse);
        }

        followMouse();
    </script>

</body>

</html>
