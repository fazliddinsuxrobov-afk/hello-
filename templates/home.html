
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assalomu alaykum</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #050610;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas background */
        #background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Static text */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 25px;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        h1 {
            font-size: clamp(35px, 7vw, 76px);
            font-weight: 600;
            letter-spacing: -2px;

            background: linear-gradient(
                110deg,
                #ffffff,
                #b9aaff,
                #70d9ff,
                #ffffff
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .name {
            margin-top: 22px;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #c9c5e8;
        }

        .title {
            margin-top: 9px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 8px;
            color: #8f8aa9;
        }

        .line {
            width: min(220px, 60vw);
            height: 2px;
            margin: 30px auto 0;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                transparent,
                #a99aff,
                #65d9ff,
                transparent
            );
        }
    </style>
</head>

<body>

    <canvas id="background"></canvas>

    <main class="content">
        <h1>Assalomu alaykum</h1>
        <div class="name">Ibrohim</div>
        <div class="title">USTOZ</div>
        <div class="line"></div>
    </main>

    <script>
        const canvas = document.getElementById("background");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let particles = [];
        let animationId;

        const PARTICLE_COUNT = 90;
        const CONNECTION_DISTANCE = 150;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            createParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;

                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;

                this.radius = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) {
                    this.vx *= -1;
                }

                if (this.y < 0 || this.y > height) {
                    this.vy *= -1;
                }
            }

            draw() {
                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(160, 150, 255, ${this.alpha})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#8270ff";

                ctx.fill();

                ctx.shadowBlur = 0;
            }
        }

        function createParticles() {
            particles = [];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i];
                    const b = particles[j];

                    const dx = a.x - b.x;
                    const dy = a.y - b.y;

                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < CONNECTION_DISTANCE) {
                        const opacity =
                            (1 - distance / CONNECTION_DISTANCE) * 0.2;

                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);

                        ctx.strokeStyle =
                            `rgba(120, 140, 255, ${opacity})`;

                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }
            }
        }

        function drawGlow() {
            const time = Date.now() * 0.0003;

            const x = width / 2 + Math.sin(time) * width * 0.3;
            const y = height / 2 + Math.cos(time * 0.7) * height * 0.25;

            const gradient = ctx.createRadialGradient(
                x, y, 0,
                x, y, Math.max(width, height) * 0.55
            );

            gradient.addColorStop(0, "rgba(75, 55, 160, 0.12)");
            gradient.addColorStop(0.5, "rgba(20, 65, 120, 0.04)");
            gradient.addColorStop(1, "rgba(5, 6, 16, 0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = "#050610";
            ctx.fillRect(0, 0, width, height);

            drawGlow();

            for (const particle of particles) {
                particle.update();
                particle.draw();
            }

            drawConnections();

            animationId = requestAnimationFrame(animate);
        }

        resize();
        animate();

        window.addEventListener("resize", resize);

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                cancelAnimationFrame(animationId);
            } else {
                animate();
            }
        });
    </script>

</body>
</html>
